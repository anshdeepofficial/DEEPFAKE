services:
  deepguard:
    build: .
    image: deepguard:latest
    container_name: deepguard
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: "1"
      DEEPGUARD_RATE_LIMIT_PER_MIN: "30"
      DEEPGUARD_MAX_UPLOAD_MB: "50"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
