name: DeepGuard CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt
      - name: Validate manifests and Python syntax
        run: |
          python -m json.tool browser_extension/manifest.json >/dev/null
          python -m compileall -q app scripts tests
      - name: Run tests with coverage
        run: pytest tests/ -q --cov=app --cov-report=term-missing
      - name: Import and health smoke test
        run: |
          python - <<'PY'
          import asyncio
          from httpx import ASGITransport, AsyncClient
          from app.main import app

          async def main():
              async with AsyncClient(transport=ASGITransport(app=app), base_url="http://test") as client:
                  r = await client.get("/api/health")
                  assert r.status_code == 200
                  body = r.json()
                  assert body["status"] == "ok"
                  assert body["version"] == "1.2.0"

                  c = await client.get("/api/capabilities")
                  assert c.status_code == 200
                  assert c.json()["version"] == "1.2.0"

          asyncio.run(main())
          PY
